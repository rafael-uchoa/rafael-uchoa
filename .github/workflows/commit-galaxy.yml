name: Commit Galaxy

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/commit-galaxy.mjs"
      - ".github/workflows/commit-galaxy.yml"

permissions:
  contents: write

concurrency:
  group: commit-galaxy
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Draw galaxy
        run: node .github/scripts/commit-galaxy.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GALAXY_USER: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          if [ -z "$(git status --porcelain commit-galaxy.svg)" ]; then
            echo "Galaxy unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit-galaxy.svg
          git commit -m "Update commit galaxy"
          git push
